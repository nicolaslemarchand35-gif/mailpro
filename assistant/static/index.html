<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Assistant mail</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <h1>Assistant mail</h1>
      <p class="muted">Accès privé.</p>
      <div id="login-firebase" hidden>
        <label>Adresse e-mail<input type="email" name="email" autocomplete="username" required></label>
        <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
      </div>
      <div id="login-token" hidden>
        <label>Jeton d'accès<input type="password" name="token" autocomplete="off"></label>
      </div>
      <label class="check"><input type="checkbox" name="remember"> Rester connecté sur cet appareil</label>
      <button type="submit" class="primary">Se connecter</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="layout" hidden>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <div class="brand"><img src="/static/icon.svg" alt="" width="28" height="28"><span>Assistant mail</span></div>
      <div class="tab-list">
        <button data-view="aujourdhui" class="active"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="tab-label">Aujourd’hui</span></button>
        <button data-view="a_traiter"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l2.5-7.5A2 2 0 0 1 7.4 4h9.2a2 2 0 0 1 1.9 1.5L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></svg><span class="tab-label">À traiter</span><span class="count" data-count="a_traiter"></span></button>
        <button data-view="brouillons"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span class="tab-label">Brouillons</span><span class="count" data-count="brouillons"></span></button>
        <button data-view="a_savoir"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.01"/></svg><span class="tab-label">À savoir</span><span class="count" data-count="a_savoir"></span></button>
        <button data-view="taches"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span class="tab-label">Tâches</span><span class="count" data-count="taches"></span></button>
        <button data-view="classement"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="tab-label">Classement</span><span class="count" data-count="classement"></span></button>
        <button data-view="reglages"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="tab-label">Réglages</span></button>
      </div>
    </nav>
    <div class="content">
      <header class="topbar">
        <div class="brand mobile-only"><img src="/static/icon.svg" alt="" width="24" height="24"><span>Assistant mail</span></div>
        <div id="sync-status" class="sync-status" aria-live="polite"></div>
        <div class="top-actions">
          <button id="btn-sync" type="button" class="tinted">Synchroniser</button>
          <button id="btn-logout" type="button" class="ghost">Déconnexion</button>
        </div>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title"></h2>
        <button type="button" class="ghost" id="drawer-close" aria-label="Fermer">✕</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
